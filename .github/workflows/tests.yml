name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:               # a new push to a pull request cancels its older run
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip       # wheels only; pip still checks every SHA-256 (--require-hashes)
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Pakete
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Qt-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pyflakes fogtranslate tests tools
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
